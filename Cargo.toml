[package]
name = "bettervoxel_game_config"
version = "0.2.3"

edition = "2024"

[dependencies]
bevy_input = { version = "0.18", features = ["serialize", "keyboard"] }
bevy_transform = { version = "0.18", features = ["serialize"] }
bevy_math = { version = "0.18", features = ["serialize"] }
bevy_color = { version = "0.18", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bson = { version = "3.1.0", features = ["uuid-1", "serde"] }